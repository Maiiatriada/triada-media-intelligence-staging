name: Collector Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - collector.py
      - test_collector.py
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test collector
        run: |
          python -m py_compile collector.py
          python -m unittest -v test_collector.py
