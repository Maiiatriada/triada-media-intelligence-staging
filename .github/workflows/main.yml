name: TRIADA Media Monitoring

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'data/exclusions.json'
      - 'data/mentions_curated.json'
      - 'data/review_decisions.json'
      - 'data/monitoring.json'
      - 'data/browser_mentions.json'
      - 'tools/**'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: triada-media-monitoring
  cancel-in-progress: false

jobs:
  search-mentions:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google News publisher URL decoder
        run: python -m pip install googlenewsdecoder==0.1.7 selectolax==0.4.13 pyyaml beautifulsoup4
      - name: Verify Google News decoder dependency
        run: python -c "from googlenewsdecoder import gnewsdecoder"

      - name: Test collector and tracker tools
        run: |
          python -m unittest -v test_collector
          python -m unittest discover -s tests/python -v

      - name: Run media monitoring
        env:
          GOOGLE_ALERTS_RSS: ${{ secrets.GOOGLE_ALERTS_RSS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # The run stops, and saves nothing, if the curated mentions or the exclusion list are missing or invalid.
          TRIADA_REQUIRE_CURATED: "1"
        run: python collector.py

      - name: Save mentions database
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mentions.json mentions_review.json mentions_public.json collector_status.json mentions_flags.json

          if ! git diff --cached --quiet; then
            git commit -m "Update TRIADA media mentions"
            git push origin HEAD:main
          else
            echo "No new mentions to save"
          fi

  # A commit made with the built-in token does not start other workflows, so the site is rebuilt from here, once the
  # collector has saved. The tracker page and the Library / Overview are generated from the same mentions_public.json.
  deploy-site:
    needs: search-mentions
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/dashboard-deploy.yml
